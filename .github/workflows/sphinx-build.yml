name: Sphinx
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && 
    github.run_number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:

    runs-on: ubuntu-24.04

    services:

      pypi_wayback:

        image: ghcr.io/waleko/pypi-wayback

        ports:

        - 8629:8080

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Sphinx Gallery Cache
      uses: actions/cache@v4
      env:
        cache-name: sphx-glry-documentation
      with:
        path: |
          tutorial/MNIST
          docs/source/tutorial
        key: py3.8-${{ env.cache-name }}-${{ hashFiles('tutorial/**/*') }}

    - name: Install Dependencies
      run: |
        python -m pip install -U pip
        pip install --progress-bar off -U .[document] --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Output installed packages
      run: |
        pip freeze --all
    - name: Output dependency tree
      run: |
        pip install pipdeptree
        pipdeptree

    - name: Build Document
      run: |
        cd docs
        make html
        cd ../

    - uses: actions/upload-artifact@v4
      with:
        name: built-html
        path: |
          docs/build/html

    - uses: actions/upload-artifact@v4
      with:
        name: tutorial
        path: |
          docs/source/tutorial

  doctest:

    runs-on: ubuntu-24.04

    services:

      pypi_wayback:

        image: ghcr.io/waleko/pypi-wayback

        ports:

        - 8629:8080

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Sphinx Gallery Cache
      uses: actions/cache@v4
      env:
        cache-name: sphx-glry-doctest
      with:
        path: |
          tutorial/MNIST
          docs/source/tutorial
        key: py3.8-${{ env.cache-name }}-${{ hashFiles('tutorial/**/*') }}

    - name: Install Dependencies
      run: |
        python -m pip install -U pip
        pip install --progress-bar off -U .[document] --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Output installed packages
      run: |
        pip freeze --all
    - name: Output dependency tree
      run: |
        pip install pipdeptree
        pipdeptree

    - name: Run Doctest
      run: |
        cd docs
        make doctest

env:
  PIP_INDEX_URL: http://localhost:8629/2023-11-01
  UV_INDEX_URL: http://localhost:8629/2023-11-01
