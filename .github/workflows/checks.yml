name: Checks

on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && 
    github.run_number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: (github.event_name == 'schedule' && github.repository == 
      'optuna/optuna') || (github.event_name != 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Start PyPI Wayback
      id: wayback
      timeout-minutes: 2
      run: |
        docker run -d --name pypi-wayback -p 127.0.0.1:8629:8080 \
          ghcr.io/waleko/pypi-wayback

        for attempt in $(seq 1 15); do
          if curl --fail --silent \
            --connect-timeout 2 --max-time 5 \
            "http://localhost:8629/2023-12-22/" -o /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Wayback ready."
            exit 0
          fi
          sleep 2
        done

        echo "::warning::Wayback not ready, falling back to PyPI."
        echo "ready=false" >> "$GITHUB_OUTPUT"

    - name: Install via Wayback
      id: install_wayback
      if: steps.wayback.outputs.ready == 'true'
      continue-on-error: true
      env:
        PIP_INDEX_URL: http://localhost:8629/2023-12-22
        UV_INDEX_URL: http://localhost:8629/2023-12-22
      run: |
        python -m pip install -U pip
        pip install --progress-bar off -U .[checking]

    - name: Install via PyPI (fallback)
      if: steps.wayback.outputs.ready != 'true' || steps.install_wayback.outcome
        == 'failure'
      run: |
        python -m pip install -U pip
        pip install --progress-bar off -U .[checking]

    - name: Output installed packages
      run: |
        pip freeze --all
    - name: Output dependency tree
      run: |
        pip install pipdeptree
        pipdeptree

    - name: black
      run: black . --check --diff
    - name: flake8
      run: flake8 .
    - name: isort
      run: isort . --check --diff
    - name: mypy
      run: mypy .
    - name: blackdoc
      run: blackdoc . --check --diff
